apiVersion: apps/v1
kind: Deployment

metadata:
  name: ledger
  namespace: paylater

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ledger

  template:
    metadata:
      labels:
        app: ledger

    spec:
      containers:
        - name: ledger
          image: tejanamburi13/paylater-ledger:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 9094

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_PORT

            - name: DB_NAME
              value: "ledger_db"

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paylater-secret
                  key: MYSQL_PASSWORD

            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: CUSTOMER_SERVICE_URL

            - name: MERCHANT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: MERCHANT_SERVICE_URL

            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paylater-secret
                  key: INTERNAL_SERVICE_TOKEN

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paylater-secret
                  key: JWT_SECRET

            - name: PORT
              value: "9094"