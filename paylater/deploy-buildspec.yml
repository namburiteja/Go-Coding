version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    AWS_ACCOUNT_ID: "385427225595"
    EC2_INSTANCE_ID: "i-0ce1704ceff856bb2"

phases:
  build:
    commands:
      - echo "Starting PayLater deployment..."
      - echo "Reading image tag from BuildArtifact..."
      - export IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR_BuildArtifact/image-tag.txt")
      - 'echo "Deploying image tag: $IMAGE_TAG"'

      - |
        cat > /tmp/deploy.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail

        REGION="ap-south-1"
        ACCOUNT_ID="385427225595"
        NAMESPACE="paylater"
        IMAGE_TAG="$1"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

        echo "Refreshing ECR pull secret..."

        ECR_PASSWORD=$(aws ecr get-login-password --region "$REGION")

        kubectl create secret docker-registry ecr-registry \
          --namespace "$NAMESPACE" \
          --docker-server="$REGISTRY" \
          --docker-username=AWS \
          --docker-password="$ECR_PASSWORD" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        kubectl patch serviceaccount default \
          -n "$NAMESPACE" \
          --type='merge' \
          -p '{"imagePullSecrets":[{"name":"ecr-registry"}]}'

        echo "Updating application images..."

        kubectl set image deployment/admin \
          admin="$REGISTRY/paylater-admin:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/customer \
          customer="$REGISTRY/paylater-customer:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/frontend \
          frontend="$REGISTRY/paylater-frontend:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/gateway \
          gateway="$REGISTRY/paylater-gateway:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/ledger \
          ledger="$REGISTRY/paylater-ledger:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/merchant \
          merchant="$REGISTRY/paylater-merchant:$IMAGE_TAG" \
          -n "$NAMESPACE"

        kubectl set image deployment/report \
          report="$REGISTRY/paylater-report:$IMAGE_TAG" \
          -n "$NAMESPACE"

        echo "Waiting for rollouts..."

        for deployment in admin customer frontend gateway ledger merchant report; do
          kubectl rollout status deployment/"$deployment" \
            -n "$NAMESPACE" \
            --timeout=180s
        done

        echo "PayLater deployment completed successfully."
        EOF

      - chmod +x /tmp/deploy.sh

      - echo "Preparing SSM command..."

      - |
        export DEPLOY_SCRIPT_B64=$(base64 -w0 /tmp/deploy.sh)

        python3 - <<'PY'
        import json
        import os

        image_tag = os.environ["IMAGE_TAG"]
        script_b64 = os.environ["DEPLOY_SCRIPT_B64"]

        remote_command = (
            f'echo "{script_b64}" | base64 -d > /tmp/deploy.sh && '
            f'chmod +x /tmp/deploy.sh && '
            f'/tmp/deploy.sh "{image_tag}"'
        )

        request = {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": [os.environ["EC2_INSTANCE_ID"]],
            "Parameters": {
                "commands": [remote_command]
            },
            "Comment": f"PayLater deployment {image_tag}"
        }

        with open("/tmp/ssm-command.json", "w") as f:
            json.dump(request, f)
        PY

      - echo "Sending deployment command to EC2..."

      - |
        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_DEFAULT_REGION" \
          --cli-input-json file:///tmp/ssm-command.json \
          --query 'Command.CommandId' \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        echo "Waiting for EC2 deployment to finish..."

        aws ssm wait command-executed \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID"

        echo "EC2 deployment completed."

        STATUS=$(aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID" \
          --query 'Status' \
          --output text)

        echo "SSM final status: $STATUS"

        if [ "$STATUS" != "Success" ]; then
          echo "Deployment failed."

          aws ssm get-command-invocation \
            --region "$AWS_DEFAULT_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          exit 1
        fi

artifacts:
  files:
    - deploy-buildspec.yml