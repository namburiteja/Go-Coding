apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: paylater
spec:
  replicas: 1

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
        - name: admin
          image: paylater-admin:local

          ports:
            - containerPort: 9091

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_PORT

            - name: DB_NAME
              value: "admin_db"

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: paylater-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paylater-secret
                  key: MYSQL_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paylater-secret
                  key: JWT_SECRET

            - name: JWT_EXPIRY
              value: "24h"

            - name: PORT
              value: "9091"