services:
  mysql:
    image: mysql:8.4
    container_name: mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root123

    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployments/mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - paylater-network

  customer:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    image: paylater-customer:local
    container_name: customer-service

    env_file:
      - services/customer/.env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9093:9093"

    networks:
      - paylater-network

  merchant:
    build:
      context: .
      dockerfile: services/merchant/Dockerfile
    image: paylater-merchant:local
    container_name: merchant-service

    env_file:
      - services/merchant/.env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9092:9092"

    networks:
      - paylater-network

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    image: paylater-admin:local
    container_name: admin-service

    env_file:
      - services/admin/.env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9091:9091"

    networks:
      - paylater-network

  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    image: paylater-ledger:local
    container_name: ledger-service

    env_file:
      - services/ledger/.env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9094:9094"

    networks:
      - paylater-network

  report:
    build:
      context: .
      dockerfile: services/report/Dockerfile
    image: paylater-report:local
    container_name: report-service

    env_file:
      - services/report/.env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9095:9095"

    networks:
      - paylater-network

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: paylater-gateway:local
    container_name: gateway

    env_file:
      - gateway/.env

    depends_on:
      customer:
        condition: service_started
      merchant:
        condition: service_started
      admin:
        condition: service_started
      ledger:
        condition: service_started
      report:
        condition: service_started

    # Host 9090 — do not use 8080 (Jenkins).
    ports:
      - "9090:9090"

    networks:
      - paylater-network

  # SPA on host 8081 → nginx :80 (Jenkins keeps host 8080).
  frontend:
    build:
      context: ../paylater-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: paylater-frontend:local
    container_name: paylater-frontend

    depends_on:
      gateway:
        condition: service_started

    ports:
      - "8081:80"

    networks:
      - paylater-network

networks:
  paylater-network:

volumes:
  mysql-data:
