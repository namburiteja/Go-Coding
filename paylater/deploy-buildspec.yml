version: 0.2

phases:
  build:
    commands:
      - echo "DEPLOY BUILD STARTED"
      - echo "Reading image tag"
      - export IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR_BuildArtifact/build-outputs/image-tag.txt")
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - echo "Preparing deployment"
      - |
        cat > /tmp/deploy.sh <<'SCRIPT'
        #!/bin/bash
        set -e

        REGION="ap-south-1"
        ACCOUNT_ID="385427225595"
        NAMESPACE="paylater"
        IMAGE_TAG="$1"
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

        ECR_PASSWORD=$(aws ecr get-login-password --region "$REGION")

        kubectl create secret docker-registry ecr-registry \
          --namespace "$NAMESPACE" \
          --docker-server="$REGISTRY" \
          --docker-username=AWS \
          --docker-password="$ECR_PASSWORD" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        kubectl patch serviceaccount default \
          --namespace "$NAMESPACE" \
          --type merge \
          --patch '{"imagePullSecrets":[{"name":"ecr-registry"}]}'

        kubectl set image deployment/admin \
          admin="$REGISTRY/paylater-admin:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/customer \
          customer="$REGISTRY/paylater-customer:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/frontend \
          frontend="$REGISTRY/paylater-frontend:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/gateway \
          gateway="$REGISTRY/paylater-gateway:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/ledger \
          ledger="$REGISTRY/paylater-ledger:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/merchant \
          merchant="$REGISTRY/paylater-merchant:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        kubectl set image deployment/report \
          report="$REGISTRY/paylater-report:$IMAGE_TAG" \
          --namespace "$NAMESPACE"

        for deployment in admin customer frontend gateway ledger merchant report
        do
          kubectl rollout status deployment/$deployment \
            --namespace "$NAMESPACE" \
            --timeout=180s
        done

        echo "KUBERNETES DEPLOYMENT SUCCESS"
        SCRIPT

      - chmod +x /tmp/deploy.sh
      - DEPLOY_SCRIPT_B64=$(base64 -w0 /tmp/deploy.sh)
      - export DEPLOY_SCRIPT_B64
      - |
        python3 - <<'PY'
        import json
        import os

        image_tag = os.environ["IMAGE_TAG"]
        script_b64 = os.environ["DEPLOY_SCRIPT_B64"]

        command = (
            f'echo "{script_b64}" | base64 -d > /tmp/deploy.sh && '
            f'chmod +x /tmp/deploy.sh && '
            f'/tmp/deploy.sh "{image_tag}"'
        )

        request = {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["i-0ce1704ceff856bb2"],
            "Parameters": {
                "commands": [command]
            },
            "Comment": "PayLater deployment"
        }

        with open("/tmp/ssm-command.json", "w") as f:
            json.dump(request, f)
        PY

      - |
        COMMAND_ID=$(aws ssm send-command \
          --region ap-south-1 \
          --cli-input-json file:///tmp/ssm-command.json \
          --query 'Command.CommandId' \
          --output text)

        echo "SSM_COMMAND_ID=$COMMAND_ID"

        aws ssm wait command-executed \
          --region ap-south-1 \
          --command-id "$COMMAND_ID" \
          --instance-id i-0ce1704ceff856bb2

        STATUS=$(aws ssm get-command-invocation \
          --region ap-south-1 \
          --command-id "$COMMAND_ID" \
          --instance-id i-0ce1704ceff856bb2 \
          --query 'Status' \
          --output text)

        echo "SSM_STATUS=$STATUS"

        if [ "$STATUS" != "Success" ]; then
          aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ce1704ceff856bb2 \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          exit 1
        fi
