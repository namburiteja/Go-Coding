apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: paylater

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: paylater-frontend:local

          ports:
            - containerPort: 80

          imagePullPolicy: IfNotPresent